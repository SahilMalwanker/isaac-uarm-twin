  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#76b900"/><stop offset="1" stop-color="#4d7a00"/></linearGradient>
</defs>
<rect width="1200" height="520" rx="18" fill="#0b0b0b"/>
<rect x="1" y="1" width="1198" height="518" rx="17" fill="url(#grid)" stroke="#2a2a2a"/>
<rect x="0" y="516" width="1200" height="4" fill="url(#bar)"/>
